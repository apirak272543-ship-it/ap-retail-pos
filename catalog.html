<!doctype html>
<html lang="th"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#12805c" /><title>สินค้า — AP Retail POS</title><link rel="stylesheet" href="shared/retail.css" /><link rel="stylesheet" href="shared/retail-ui-polish.css?v=retail-ui-polish-v1"></head>
  <body data-page="catalog"><div id="app-shell" class="app-shell is-loading" aria-busy="true"><header class="topbar"><a class="brand-compact" href="pos.html"><span>AP</span> Retail POS</a><button class="icon-button" type="button" data-action="signout" aria-label="ออกจากระบบ">⇥</button></header><main class="page-content"><section class="page-heading split-heading"><div><p class="eyebrow">CATALOG</p><h1>สินค้าในร้าน</h1></div><button class="button button-primary" type="button" data-action="open-product-editor">+ เพิ่มสินค้า</button></section><section class="card"><label class="search-field"><span aria-hidden="true">⌕</span><input id="catalog-search" type="search" placeholder="ค้นหาชื่อหรือ SKU" /></label><div id="catalog-list" class="catalog-list" aria-live="polite"></div></section></main><nav class="bottom-nav" aria-label="เมนูหลัก"><a href="pos.html">ขาย</a><a class="active" href="catalog.html">สินค้า</a><a href="inventory.html">สต๊อก</a><a href="sales.html">ยอดขาย</a><a href="settings.html">ตั้งค่า</a></nav></div><dialog id="product-dialog" class="editor-dialog"><form id="product-form" class="stack-form" method="dialog"><div class="dialog-heading"><h2 id="product-dialog-title">เพิ่มสินค้า</h2><button class="icon-button" value="cancel" aria-label="ปิด">×</button></div><input id="product-id" type="hidden" /><label>ชื่อสินค้า<input id="product-name" required maxlength="160" /></label><label>SKU<input id="product-sku" maxlength="80" /></label><div class="form-grid"><label>ราคา<input id="product-price" type="number" min="0" step="0.01" required inputmode="decimal" /></label><label>หน่วย<input id="product-unit" value="ชิ้น" maxlength="32" required /></label></div><fieldset id="product-image-fields" class="media-picker"><legend>รูปสินค้า</legend><label>เลือกจากคลังภาพ<input id="product-image-library" type="file" accept="image/jpeg,image/png,image/webp" /></label><label>ถ่ายรูปด้วยกล้อง<input id="product-image-camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" /></label></fieldset><p class="input-hint">ระบบรับเฉพาะรูปจากคลังภาพหรือกล้อง บีบอัดเป็น JPEG คุณภาพ 0.82 และด้านยาวไม่เกิน 1200px ก่อนอัปโหลด</p><p id="product-policy-note" class="input-hint" hidden></p><button class="button button-primary" type="submit">บันทึกสินค้า</button><p id="product-message" class="form-message" role="status"></p></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared/runtime-config.js"></script><script type="module" src="shared/retail-app.js?auth=login-v1"></script></body></html>
