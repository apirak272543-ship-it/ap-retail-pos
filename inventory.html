<!doctype html>
<html lang="th"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#12805c" /><title>สต๊อก — AP Retail POS</title><link rel="stylesheet" href="shared/retail.css" /></head>
  <body data-page="inventory"><div id="app-shell" class="app-shell is-loading" aria-busy="true"><header class="topbar"><a class="brand-compact" href="pos.html"><span>AP</span> Retail POS</a><button class="icon-button" type="button" data-action="signout" aria-label="ออกจากระบบ">⇥</button></header><main class="page-content"><section class="page-heading split-heading"><div><p class="eyebrow">INVENTORY</p><h1>สต๊อกสินค้า</h1></div><button class="button button-primary" type="button" data-action="open-movement">ปรับสต๊อก</button></section><section class="card"><div id="inventory-list" class="catalog-list" aria-live="polite"></div></section></main><nav class="bottom-nav" aria-label="เมนูหลัก"><a href="pos.html">ขาย</a><a href="catalog.html">สินค้า</a><a class="active" href="inventory.html">สต๊อก</a><a href="sales.html">ยอดขาย</a><a href="settings.html">ตั้งค่า</a></nav></div><dialog id="movement-dialog" class="editor-dialog"><form id="movement-form" class="stack-form" method="dialog"><div class="dialog-heading"><h2>บันทึกการเคลื่อนไหวสต๊อก</h2><button class="icon-button" value="cancel" aria-label="ปิด">×</button></div><label>สินค้า<select id="movement-product" required></select></label><label>ประเภท<select id="movement-type" required><option value="receipt">รับสินค้าเข้า</option><option value="adjustment">ปรับสต๊อก</option></select></label><label>จำนวน<input id="movement-quantity" type="number" step="0.001" required inputmode="decimal" /></label><label>เหตุผล<input id="movement-reason" maxlength="240" required /></label><button class="button button-primary" type="submit">บันทึกรายการ</button><p id="movement-message" class="form-message" role="status"></p></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared/runtime-config.js"></script><script type="module" src="shared/retail-app.js"></script></body></html>
