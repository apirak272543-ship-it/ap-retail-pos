<!doctype html>
<html data-login-app="retail_pos" lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12805c" />
    <meta name="description" content="AP Retail POS สำหรับจัดการการขาย สินค้า และสต๊อกของร้านค้า" />
    <title>AP Retail POS | ระบบขายหน้าร้าน</title>
    <link rel="stylesheet" href="shared/retail.css" />
  <link rel="stylesheet" href="shared/ap-login-media.css"><script src="shared/ap-login-media.js"></script></head>
  <body data-page="signin">
    <main class="auth-shell">
      <section class="auth-card" aria-label="เข้าสู่ระบบ AP Retail POS">
        <div class="brand-lockup" aria-hidden="true"><div class="brand-mark">AP</div></div>
        <form id="signin-form" class="stack-form" novalidate><input id="email" name="email" type="email" autocomplete="email" inputmode="email" aria-label="อีเมล" required /><input id="password" name="password" type="password" autocomplete="current-password" aria-label="รหัสผ่าน" required /><button class="button button-primary" type="submit">เข้าสู่ระบบ</button></form>
        <p id="signin-message" class="form-message" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared/runtime-config.js"></script><script type="module" src="shared/retail-app.js"></script>
  </body>
</html>
